<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎨 HarmonyArt Canvas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>🎨 HarmonyArt Canvas</h1>

    <div class="container">
        <div class="toolbar">
            <!-- Tool Selection -->
            <div class="toolbar-section">
                <button id="tool-brush" data-tool="brush" class="active" onclick="setTool('brush')">🖌️ Brush</button>
                <button id="tool-rect" data-tool="rect" onclick="setTool('rect')">⬜ Rectangle</button>
                <button id="tool-circle" data-tool="circle" onclick="setTool('circle')">⭕ Circle</button>
                <button id="tool-star" data-tool="star" onclick="setTool('star')">★ Star</button>
            </div>

            <!-- Shape Options -->
            <div class="toolbar-section">
                <label class="checkbox-container">
                    <input type="checkbox" id="fillCheck"> Fill
                </label>
            </div>

            <!-- Styling Options -->
            <div class="toolbar-section">
                <input type="color" id="colorPicker" value="#000000" title="Choose Color">
                <label for="sizeSlider" style="border: none; padding: 0; background: none;">
                    Size:
                    <input type="range" id="sizeSlider" min="1" max="60" value="6" title="Adjust Size">
                    <span class="size-display" id="sizeDisplay">6</span>px
                </label>
                <label for="opacitySlider" style="border: none; padding: 0; background: none; margin-left:8px;">
                    Opacity:
                    <input type="range" id="opacitySlider" min="0" max="100" value="100" title="Adjust Opacity">
                    <span class="size-display" id="opacityDisplay">100</span>%
                </label>
                <label for="brushSelect" style="border: none; padding: 0; background: none;">
                    Brush:
                    <select id="brushSelect" title="Choose Brush">
                        <option value="brush">Brush (smooth)</option>
                        
                        <option value="marker">Marker</option>
                        <option value="spray">Spray</option>
                        <option value="textured">Textured</option>
                        <option value="calligraphy">Calligraphy</option>
                        <option value="charcoal">Charcoal</option>
                        <option value="ink">Ink</option>
                        <option value="watercolor">Watercolor</option>
                        <option value="glow">Glow</option>
                        <option value="splatter">Splatter</option>
                        
                        <option value="chalk">Chalk</option>
                        <option value="pattern">Pattern</option>
                        <option value="confetti">Confetti</option>
                        <option value="eraser">Eraser</option>
                    </select>
                </label>
            </div>

            <!-- Actions -->
            <div class="toolbar-section">
                <input type="url" id="gameUrl" placeholder="Game upload URL (leave empty to download)" title="Paste game endpoint URL" />
                <button id="undoBtn" onclick="undoLastStroke()">↶ Undo</button>
                <button id="clearBtn" onclick="clearCanvas()">🗑️ Clear</button>
                <button id="sendBtn" onclick="sendToGame()">🎮 Export</button>
            </div>
        </div>

        <canvas id="paintCanvas" width="800" height="500"></canvas>
    </div>

    <div class="footer">
        <p>Draw freely with multiple brush styles | Export your artwork as PNG</p>
    </div>

    

    <script src="app.js" defer></script>
</body>
</html>
